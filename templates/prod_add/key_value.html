{% load static %}
<style>
    .key-value-wrapper {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 15px;
        background: #f9fafb;
    }

    .key-value-pair {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
    }

    .key-value-pair input {
        flex: 1;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 14px;
    }

    .key-value-pair button.remove {
        background: #ef4444;
        border: none;
        color: white;
        border-radius: 6px;
        padding: 4px 8px;
        cursor: pointer;
        transition: background 0.2s ease;
    }

    .key-value-pair button.remove:hover {
        background: #dc2626;
    }

    .add-row-btn {
        background: #22c55e;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 14px;
        margin-top: 5px;
        transition: background 0.2s ease;
    }

    .add-row-btn:hover {
        background: #16a34a;
    }
</style>

<div class="key-value-wrapper" id="{{ widget.attrs.id }}">
    <div class="pairs">
        {% for key, value in widget.value.items %}
            <div class="key-value-pair">
                <input type="text" name="{{ widget.name }}_key" value="{{ key }}" placeholder="Key">
                <input type="text" name="{{ widget.name }}_value" value="{{ value }}" placeholder="Value">
                <button type="button" class="remove">✕</button>
            </div>
        {% empty %}
            <div class="key-value-pair">
                <input type="text" name="{{ widget.name }}_key" placeholder="Key">
                <input type="text" name="{{ widget.name }}_value" placeholder="Value">
                <button type="button" class="remove">✕</button>
            </div>
        {% endfor %}
    </div>
    <button type="button" class="add-row-btn">➕ Add Attribute</button>
</div>

<script>
(function() {
    const container = document.currentScript.previousElementSibling;
    const pairsContainer = container.querySelector('.pairs');
    const addBtn = container.querySelector('.add-row-btn');

    // Add new row
    addBtn.addEventListener('click', () => {
        const div = document.createElement('div');
        div.className = 'key-value-pair';
        div.innerHTML = `
            <input type="text" name="{{ widget.name }}_key" placeholder="Key">
            <input type="text" name="{{ widget.name }}_value" placeholder="Value">
            <button type="button" class="remove">✕</button>
        `;
        pairsContainer.appendChild(div);
        div.querySelector('.remove').addEventListener('click', () => div.remove());
    });

    // Existing remove buttons
    pairsContainer.querySelectorAll('.remove').forEach(btn => {
        btn.addEventListener('click', () => btn.parentElement.remove());
    });
})();
</script>
